# Les secrets n'ont pas de valeur par defaut : ils viennent de l'environnement (.env, voir .env.example).
spring:
  application:
    name: paiement-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/paiement_db
    username: paiement_user
    password: ${PAIEMENT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    publisher-confirm-type: correlated
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            # seul delai applique aux appels inter-services : la limite de temps de Resilience4j est desactivee
            # par defaut dans common (CircuitBreakerDefaultsEnvironmentPostProcessor)
            read-timeout: 3000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true

internatadmin:
  security:
    jwt-public-key-b64: ${JWT_PUBLIC_KEY_B64}
    internal-api-key: ${INTERNAL_API_KEY}
  services:
    enfant: ${ENFANT_SERVICE_URL:http://enfant-service:8080}
    personnel: ${PERSONNEL_SERVICE_URL:http://personnel-service:8080}
  paiement:
    # Attente maximale du verrou d'une mensualite (paiements simultanes du meme eleve pour le meme mois) : au-dela, 503.
    lock-timeout: 5s

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
