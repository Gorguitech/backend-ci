# Environnement de developpement local du backend.
# Profils : infra (postgres, rabbitmq). Les profils core, eleves, finance et all
# sont ajoutes avec les services correspondants.
#
# Usage : cp .env.example .env  (puis renseigner les valeurs)
#         docker compose --profile infra up -d

name: internatadmin

services:
  postgres:
    image: postgres:16-alpine
    profiles: [infra, core, eleves, finance, all]
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      ENFANT_DB_PASSWORD: ${ENFANT_DB_PASSWORD}
      PERSONNEL_DB_PASSWORD: ${PERSONNEL_DB_PASSWORD}
      PAIEMENT_DB_PASSWORD: ${PAIEMENT_DB_PASSWORD}
      COMPTABILITE_DB_PASSWORD: ${COMPTABILITE_DB_PASSWORD}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: [infra, core, eleves, finance, all]
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq-data:
