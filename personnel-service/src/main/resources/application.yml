# Les secrets n'ont pas de valeur par defaut : ils viennent de l'environnement (.env, voir .env.example).
spring:
  application:
    name: personnel-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/personnel_db
    username: personnel_user
    password: ${PERSONNEL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    publisher-confirm-type: correlated

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true

internatadmin:
  security:
    jwt-public-key-b64: ${JWT_PUBLIC_KEY_B64}
    internal-api-key: ${INTERNAL_API_KEY}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
