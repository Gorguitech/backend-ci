# Les secrets n'ont pas de valeur par defaut : ils viennent de l'environnement (.env, voir .env.example).
spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      # Le corps multipart (logo) est relaye tel quel a auth-service, qui applique la limite et renvoie le 413.
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  cloud:
    gateway:
      server:
        webmvc:
          http-client:
            connect-timeout: 2s
            read-timeout: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true

internatadmin:
  security:
    # La gateway applique son propre filtre (etat du compte) : la chaine des services metier est desactivee.
    enabled: false
    jwt-public-key-b64: ${JWT_PUBLIC_KEY_B64}
    internal-api-key: ${INTERNAL_API_KEY}
  gateway:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    # Connexion et lecture de l'etat du compte : au-dela, 503 (jamais 401).
    account-state-timeout: 2s
    services:
      auth: ${AUTH_SERVICE_URL:http://auth-service:8080}
      enfant: ${ENFANT_SERVICE_URL:http://enfant-service:8080}
      personnel: ${PERSONNEL_SERVICE_URL:http://personnel-service:8080}
      paiement: ${PAIEMENT_SERVICE_URL:http://paiement-service:8080}
      comptabilite: ${COMPTABILITE_SERVICE_URL:http://comptabilite-service:8080}
      pilotage: ${PILOTAGE_SERVICE_URL:http://pilotage-service:8080}
      audit: ${AUDIT_SERVICE_URL:http://audit-service:8080}

# Swagger UI unique : les documents OpenAPI des services sont relayes sous /api-docs/{service}.
springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /api-docs/auth
      - name: audit-service
        url: /api-docs/audit
      - name: enfant-service
        url: /api-docs/enfant
      - name: personnel-service
        url: /api-docs/personnel
      - name: paiement-service
        url: /api-docs/paiement
      - name: comptabilite-service
        url: /api-docs/comptabilite
      - name: pilotage-service
        url: /api-docs/pilotage

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
