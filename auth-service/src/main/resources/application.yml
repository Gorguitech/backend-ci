# Les secrets n'ont pas de valeur par defaut : ils viennent de l'environnement (.env, voir .env.example).
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/auth_db
    username: auth_user
    password: ${AUTH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    publisher-confirm-type: correlated

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    # Au-dela de 3 Mo, Tomcat doit lire le corps refuse pour que le client recoive le 413 FILE_TOO_LARGE.
    # Avec la valeur par defaut (2 Mo), la connexion est coupee et le client ne voit qu'une erreur reseau.
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true

internatadmin:
  security:
    jwt-public-key-b64: ${JWT_PUBLIC_KEY_B64}
    internal-api-key: ${INTERNAL_API_KEY}
    public-paths:
      - /api/auth/**
  jwt:
    private-key-b64: ${JWT_PRIVATE_KEY_B64}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  admin:
    # Utilise uniquement si aucun compte ADMIN n'existe encore (premier demarrage).
    initial-password-hash: ${ADMIN_INITIAL_PASSWORD_HASH:}
  parametres:
    logo-dir: ${LOGO_DIR:/data/logos}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
