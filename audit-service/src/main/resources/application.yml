# Les secrets n'ont pas de valeur par defaut : ils viennent de l'environnement (.env, voir .env.example).
spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/audit_db
    username: audit_user
    password: ${AUDIT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Le frontend lit content, totalPages, totalElements, size, number, numberOfElements,
        # first, last et empty au premier niveau : serialisation PageImpl d'origine conservee.
        serialization-mode: direct
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    listener:
      simple:
        # 3 tentatives (attente de 1 s puis 2 s), puis rejet sans remise en file : le message part en DLQ.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true

internatadmin:
  security:
    jwt-public-key-b64: ${JWT_PUBLIC_KEY_B64}
    internal-api-key: ${INTERNAL_API_KEY}
  audit:
    # audit-service consomme les evenements, il n'en publie pas.
    publisher:
      enabled: false

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
